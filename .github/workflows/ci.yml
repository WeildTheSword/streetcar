# DESCRIPTION:
# CI yml file for GitHub Actions. This file defines the CI pipeline for the project.
# It includes jobs for backend and frontend testing, as well as caching dependencies.

    # Attribution: Qixuan Liu & Claude
    # SCRUM-46: Add GitHub Actions CI workflow
    # Date: 10/2/2026



# Workflow display name
name: CI

# Every time user opens push/ pull yml pipeline runs
on:
  push:
  pull_request:



# Define a list of jobs... Ie. different sections for each part of CI pipeline
jobs: 

  # -------------------------------------------------------------------------------------------
  # BACKEND TEST SECTION: One job for the backend
  backend: 
    # using ubuntu VM
    # We could do mac later if we build this out as an App. (Windows, macOS, etc.)
    runs-on: ubuntu-latest  # We need a VM for running anything. Github stores code but can't run a test pipeline
    defaults:
      run:
        # Specify backed folder as directory for this test section
        working-directory: backend


    steps:
      # Copy repo to VM
      - uses: actions/checkout@v4

      # Install Java 17 and cache Maven dependencies for faster builds
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          # Make sure to cache the downloaded libraries. 
          # Avoids new installation of dependencies every time the pipeline runs.
          # If the .xml file changes, the cache will be invalidated and dependencies will be reinstalled.
          # Github stores cache from VM in different location than the code, so we need to specify the path to the .xml file for caching.
          cache: maven



      # verify runs the unit tests and the JaCoCo 70% service coverage check
      - run: chmod +x mvnw && ./mvnw -B verify #Backedn checks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: backend/target/site/jacoco



  # -------------------------------------------------------------------------------------------
  # FRONTEND TEST SECTION: One job for the frontend
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      # Also run here (not only in frontend.yml) so the deploy jobs can wait on the tests.
      - run: npm test
      - run: npm run build
  # -------------------------------------------------------------------------------------------
  # DOCKER SECTION (SCRUM-97): build the backend image Render deploys and prove it starts.
  # A 401 from /courses means the app is up, reachable from outside the container on PORT,
  # and enforcing auth. The secret here is a throwaway value for this check only.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t streetcar-backend backend
      - run: >-
          docker run -d --name streetcar-backend -p 9000:9000
          -e PORT=9000
          -e JWT_SECRET=ci-only-dummy-secret-0123456789abcdef0123456789
          streetcar-backend
      - name: Wait for the API to answer 401 on /courses
        run: |
          for i in $(seq 1 45); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9000/courses || true)
            if [ "$status" = "401" ]; then
              echo "API is up: GET /courses returned 401 after about $((i * 2)) seconds."
              exit 0
            fi
            sleep 2
          done
          echo "API did not return 401 within 90 seconds (last status: $status)."
          exit 1
      - name: Container logs
        if: always()
        run: docker logs streetcar-backend || true
  # -------------------------------------------------------------------------------------------
  # DEPLOY SECTION (SCRUM-103): only a push to main, and only after every check above passes.
  # Each job POSTs a deploy hook stored as a GitHub secret. Until a hook exists the secret is
  # empty, and the job skips with a notice instead of failing. See docs/deployment.md.
  deploy-backend:
    needs: [backend, frontend, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Render deploy hook
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::notice title=Backend deploy skipped::RENDER_DEPLOY_HOOK_URL is not set. See docs/deployment.md."
            exit 0
          fi
          curl -fsS -X POST "$HOOK_URL" > /dev/null
          echo "Render deploy triggered."

  deploy-frontend:
    needs: [backend, frontend, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Vercel deploy hook
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::notice title=Frontend deploy skipped::VERCEL_DEPLOY_HOOK_URL is not set. See docs/deployment.md."
            exit 0
          fi
          curl -fsS -X POST "$HOOK_URL" > /dev/null
          echo "Vercel deploy triggered."
  # -------------------------------------------------------------------------------------------
