# Tests get their own in-memory database, so a running dev server does not hold
# the file lock and test rows never land in the local demo data.
spring.datasource.url=jdbc:h2:mem:streetcar-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
# schema.sql owns the tables, so Hibernate must not create or drop them.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Only ever signs test tokens; see TestTokens.
jwt.secret=test-only-secret-at-least-32-bytes-long
