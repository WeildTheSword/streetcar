spring.application.name=backend
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/streetcar}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
# schema.sql owns the tables, so Hibernate must not create or drop them.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
jwt.secret=${JWT_SECRET:}
server.address=${SERVER_ADDRESS:127.0.0.1}
# Render sets PORT. Locally it stays 8080, the frontend's default API URL.
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
